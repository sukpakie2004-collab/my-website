<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #172033;
    }
    .container {
      max-width: 720px;
      margin: 25px auto;
    }
    .box {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 14px #0001;
    }
    h2, h3 { margin-top: 0; }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 7px;
    }
    input, textarea { border: 1px solid #cbd5e1; }
    textarea { min-height: 150px; resize: vertical; }
    button {
      border: 0;
      background: #087d45;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .blue { background: #2563eb; }
    .red { background: #dc2626; }
    .gray { background: #475569; }
    .post {
      border: 1px solid #e2e8f0;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }
    .post img {
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      display: block;
      margin: 10px 0;
      border-radius: 8px;
    }
    #message, #postMessage { overflow-wrap: anywhere; }
    .muted { color: #64748b; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<div class="container">

  <section class="box" id="loginBox">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="আপনার Gmail" required>

      <input id="password" type="password"
        placeholder="পাসওয়ার্ড" required>

      <button type="submit" id="loginButton">
        Login
      </button>
    </form>

    <button type="button" class="blue" id="resetButton">
      Forgot Password
    </button>

    <p id="message"></p>
  </section>

  <section id="adminPanel" hidden>

    <div class="box">
      <h2>Admin Panel</h2>
      <p>আপনি অ্যাডমিন হিসেবে লগইন করেছেন।</p>

      <button type="button" class="gray" id="logoutButton">
        Logout
      </button>
    </div>

    <div class="box">
      <h3>নতুন পোস্ট লিখুন</h3>

      <form id="postForm">
        <input id="postTitle" type="text"
          placeholder="পোস্টের শিরোনাম" required>

        <textarea id="postContent"
          placeholder="পোস্টের বিস্তারিত লিখুন..."
          required></textarea>

        <label for="postImage">পোস্টের ছবি (ঐচ্ছিক)</label>

        <input id="postImage" type="file"
          accept="image/*">

        <button type="submit" id="publishButton">
          Publish Post
        </button>
      </form>

      <p id="postMessage"></p>
    </div>

    <div class="box">
      <h3>আগের পোস্টগুলো</h3>

      <button type="button" class="blue" id="refreshButton">
        পোস্ট রিফ্রেশ করুন
      </button>

      <div id="postsList">পোস্ট লোড হচ্ছে...</div>
    </div>

  </section>
</div>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://wxxmzqnumbgnspfdcdqb.supabase.co';

  // এখানে আপনার Supabase Publishable Key বসাবেন
  const SUPABASE_ANON_KEY =
    'sb_publishable_xDKg6K0npi5fPKvAPJZU9Q_9yIGvvfQ';

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const $ = (id) => document.getElementById(id);

  function showMessage(text, isError = false) {
    $('message').textContent = text;
    $('message').style.color =
      isError ? '#dc2626' : '#087d45';
  }

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  // Admin যাচাই
  async function checkAdmin() {
    try {
      const { data, error } =
        await supabase.auth.getSession();

      if (error) throw error;

      if (!data.session) {
        $('loginBox').hidden = false;
        $('adminPanel').hidden = true;
        return false;
      }

      const user = data.session.user;

      const { data: roleData, error: roleError } =
        await supabase
          .from('user_roles')
          .select('role')
          .eq('user_id', user.id)
          .single();

      if (roleError || roleData?.role !== 'admin') {
        await supabase.auth.signOut();

        $('loginBox').hidden = false;
        $('adminPanel').hidden = true;

        showMessage('আপনার Admin অনুমতি নেই।', true);
        return false;
      }

      $('loginBox').hidden = true;
      $('adminPanel').hidden = false;

      await loadPosts();
      return true;

    } catch (error) {
      showMessage('সমস্যা: ' + error.message, true);
      return false;
    }
  }

  // Login
  $('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();

    $('loginButton').disabled = true;
    showMessage('লগইন হচ্ছে...');

    try {
      const email = $('email').value.trim();
      const password = $('password').value;

      const { error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      const ok = await checkAdmin();

      if (ok) {
        showMessage('Admin Login সফল হয়েছে!');
      }

    } catch (error) {
      showMessage('লগইন হয়নি: ' + error.message, true);
    }

    $('loginButton').disabled = false;
  });

  // Forgot Password
  $('resetButton').addEventListener('click', async () => {
    const email = $('email').value.trim();

    if (!email) {
      showMessage('আগে Gmail লিখুন।', true);
      return;
    }

    showMessage('রিসেট লিংক পাঠানো হচ্ছে...');

    try {
      const redirectURL =
        window.location.origin +
        '/my-website/reset-password.html';

      const { error } =
        await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: redirectURL
        });

      if (error) throw error;

      showMessage('আপনার Gmail-এ রিসেট লিংক পাঠানো হয়েছে।');

    } catch (error) {
      showMessage('সমস্যা হয়েছে: ' + error.message, true);
    }
  });

  // আগের পোস্ট লোড
  async function loadPosts() {
    $('postsList').textContent = 'পোস্ট লোড হচ্ছে...';

    try {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;

      if (!data || data.length === 0) {
        $('postsList').textContent = 'এখনো কোনো পোস্ট নেই।';
        return;
      }

      $('postsList').innerHTML = data.map((post) => `
        <article class="post">
          <h3>${escapeHTML(post.title)}</h3>

          <p>${escapeHTML(post.content).replace(/\n/g, '<br>')}</p>

          ${post.image_url
            ? <img src="${escapeHTML(post.image_url)}" alt="পোস্টের ছবি">
            : ''}

          <p class="muted">
            ${post.created_at
              ? new Date(post.created_at).toLocaleString('bn-BD')
              : ''}
          </p>

          <button type="button" class="red"
            data-delete-id="${escapeHTML(post.id)}">
            পোস্ট মুছুন
          </button>
        </article>
      `).join('');

    } catch (error) {
      $('postsList').textContent =
        'পোস্ট লোড হয়নি: ' + error.message;
    }
  }

  // নতুন পোস্ট Publish
  $('postForm').addEventListener('submit', async (event) => {
    event.preventDefault();

    const title = $('postTitle').value.trim();
    const content = $('postContent').value.trim();
    const file = $('postImage').files[0];

    if (!title || !content) {
      $('postMessage').textContent =
        'শিরোনাম ও লেখা পূরণ করুন।';
      return;
    }

    $('publishButton').disabled = true;
    $('postMessage').textContent = 'পোস্ট প্রকাশ হচ্ছে...';

    try {
      let imageURL = null;

      if (file) {
        if (!file.type.startsWith('image/')) {
          throw new Error('শুধু ছবির ফাইল নির্বাচন করুন।');
        }

        if (file.size > 5 * 1024 * 1024) {
          throw new Error('ছবির সাইজ ৫ MB-এর কম হতে হবে।');
        }

        const filePath =
          crypto.randomUUID() + '-' +
          file.name.replace(/[^a-zA-Z0-9.-]/g, '');

        const { error: uploadError } = await supabase
          .storage
          .from('post-images')
          .upload(filePath, file, {
            cacheControl: '3600',
            upsert: false
          });

        if (uploadError) throw uploadError;

        const { data: publicData } = supabase
          .storage
          .from('post-images')
          .getPublicUrl(filePath);

        imageURL = publicData.publicUrl;
      }

      const { error: insertError } = await supabase
        .from('posts')
        .insert([{
          title,
          content,
          image_url: imageURL,
          published: true
        }]);

      if (insertError) throw insertError;

      $('postForm').reset();

      $('postMessage').textContent =
        'পোস্ট সফলভাবে প্রকাশ হয়েছে!';

      await loadPosts();

    } catch (error) {
      $('postMessage').textContent =
        'সমস্যা হয়েছে: ' + error.message;
    }

    $('publishButton').disabled = false;
  });

  // পোস্ট মুছে ফেলা
  $('postsList').addEventListener('click', async (event) => {
    const button = event.target.closest('[data-delete-id]');

    if (!button) return;

    if (!confirm('এই পোস্টটি মুছে ফেলতে চান?')) return;

    button.disabled = true;

    const postId = button.dataset.deleteId;

    const { error } = await supabase
      .from('posts')
      .delete()
      .eq('id', postId);

    if (error) {
      alert('পোস্ট মোছা যায়নি: ' + error.message);
      button.disabled = false;
      return;
    }

    await loadPosts();
  });

  // পোস্ট রিফ্রেশ
  $('refreshButton').addEventListener('click', loadPosts);

  // Logout
  $('logoutButton').addEventListener('click', async () => {
    const { error } = await supabase.auth.signOut();

    if (error) {
      alert('Logout সমস্যা: ' + error.message);
      return;
    }

    $('adminPanel').hidden = true;
    $('loginBox').hidden = false;
    showMessage('আপনি লগআউট করেছেন।');
  });

  // আগে থেকে Login করা থাকলে যাচাই
  await checkAdmin();

</script>
</body>
</html>
