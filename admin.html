<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 15px #0002;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 6px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #087d45;
      color: white;
      border: none;
      cursor: pointer;
    }
    #resetButton { background: #2563eb; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="আপনার Gmail" required>

      <input id="password" type="password"
        placeholder="পাসওয়ার্ড" required>

      <button type="submit">Login</button>
    </form>

    <button type="button" id="resetButton">
      Forgot Password
    </button>

    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // আপনার আগের Supabase Project URL
    const SUPABASE_URL =
      'https://wxxmzqnumbgnspfdcdqb.supabase.co';

    // আপনার আগের Publishable Key
    const SUPABASE_ANON_KEY =
      'sb_publishable_xDKg6K0npi5fPKvAPJZU9Q_9yIGvvfQ';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const message = document.getElementById('message');

    // Admin Login
    document.getElementById('loginForm')
      .addEventListener('submit', async (event) => {
        event.preventDefault();

        message.textContent = 'লগইন হচ্ছে...';

        const email =
          document.getElementById('email').value.trim();

        const password =
          document.getElementById('password').value;

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          message.textContent =
            'লগইন হয়নি: ' + error.message;
          return;
        }

        const { data: roleData, error: roleError } =
          await supabase
            .from('user_roles')
            .select('role')
            .eq('user_id', data.user.id)
            .single();

        if (roleError || roleData?.role !== 'admin') {
          await supabase.auth.signOut();
          message.textContent =
            'আপনার Admin অনুমতি নেই।';
          return;
        }

        message.textContent =
          'Admin Login সফল হয়েছে!';
      });

    // Password Reset
    document.getElementById('resetButton')
      .addEventListener('click', async () => {
        const email =
          document.getElementById('email').value.trim();

        if (!email) {
          message.textContent =
            'আগে Gmail লিখুন।';
          return;
        }

        message.textContent =
          'রিসেট লিংক পাঠানো হচ্ছে...';

        const redirectURL =
          window.location.origin +
          '/my-website/reset-password.html';

        const { error } =
          await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: redirectURL
          });

        if (error) {
          message.textContent =
            'সমস্যা হয়েছে: ' + error.message;
          return;
        }

        message.textContent =
          'আপনার Gmail-এ নতুন রিসেট লিংক পাঠানো হয়েছে।';
      });
  </script>
</body>
</html>
