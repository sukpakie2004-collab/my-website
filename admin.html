<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .container {
      max-width: 700px;
      margin: 30px auto;
    }
    .box {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 7px;
    }
    input, textarea {
      border: 1px solid #cbd5e1;
    }
    textarea { min-height: 130px; }
    button {
      border: 0;
      background: #087d45;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .delete { background: #c62828; }
    .secondary { background: #475569; }
    .post {
      border: 1px solid #ddd;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
    }
    .post img {
      max-width: 100%;
      max-height: 250px;
      display: block;
      margin: 10px 0;
      border-radius: 8px;
    }
    #message { overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>

<body>
<div class="container">

  <!-- Login -->
  <section class="box" id="loginBox">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="আপনার Gmail"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="পাসওয়ার্ড"
        required
      >

      <button type="submit" id="loginButton">Login</button>
    </form>

    <p id="message"></p>
  </section>

  <!-- Admin Panel -->
  <section id="adminPanel" class="hidden">
    <div class="box">
      <h2>Admin Panel</h2>
      <p>আপনি সফলভাবে লগইন করেছেন।</p>
      <button type="button" id="logoutButton" class="secondary">
        Logout
      </button>
    </div>

    <div class="box">
      <h2>নতুন পোস্ট লিখুন</h2>

      <form id="postForm">
        <input
          id="postTitle"
          type="text"
          placeholder="পোস্টের শিরোনাম"
          required
        >

        <textarea
          id="postContent"
          placeholder="পোস্টের বিস্তারিত লিখুন"
          required
        ></textarea>

        <label>পোস্টের ছবি (ঐচ্ছিক)</label>
        <input id="postImage" type="file" accept="image/*">

        <button type="submit" id="postButton">
          পোস্ট সংরক্ষণ করুন
        </button>
      </form>

      <p id="postMessage"></p>
    </div>

    <div class="box">
      <h2>আপনার পোস্টগুলো</h2>
      <div id="postsList">পোস্ট লোড হচ্ছে...</div>
    </div>
  </section>

</div>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // Supabase Project URL
  const SUPABASE_URL =
    'https://wxxmzqnumbgnspfdcdqb.supabase.co';

  // এখানে আপনার Publishable Key একবার বসান
  const SUPABASE_ANON_KEY =
    'sb_publishable_xDKg6K0npi5fPKvAPJZU9Q_9yIGvvfQ';

  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const $ = (id) => document.getElementById(id);

  let currentUser = null;

  function showMessage(message) {
    $('message').textContent = message;
  }

  function showAdminPanel() {
    $('loginBox').classList.add('hidden');
    $('adminPanel').classList.remove('hidden');
  }

  function showLogin() {
    $('adminPanel').classList.add('hidden');
    $('loginBox').classList.remove('hidden');
  }

  // Admin যাচাই
  async function checkAdmin() {
    const { data: userData, error: userError } =
      await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
      throw new Error('লগইন পাওয়া যায়নি।');
    }

    currentUser = userData.user;

    const { data, error } = await supabaseClient
      .from('user_roles')
      .select('role')
      .eq('user_id', currentUser.id)
      .single();

    if (error) throw error;

    if (data.role !== 'admin') {
      throw new Error('আপনার Admin অনুমতি নেই।');
    }

    return true;
  }

  // Login
  $('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();

    const button = $('loginButton');
    button.disabled = true;
    showMessage('লগইন হচ্ছে...');

    try {
      const email = $('email').value.trim();
      const password = $('password').value;

      const { error } = await supabaseClient.auth
        .signInWithPassword({ email, password });

      if (error) throw error;

      await checkAdmin();

      showMessage('Admin Login সফল হয়েছে!');
      showAdminPanel();
      await loadPosts();

    } catch (error) {
      showMessage('সমস্যা: ' + error.message);
      await supabaseClient.auth.signOut();
    } finally {
      button.disabled = false;
    }
  });

  // Logout
  $('logoutButton').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    currentUser = null;
    showLogin();
    showMessage('আপনি লগআউট করেছেন।');
  });

  // ছবি Storage-এ আপলোড
  async function uploadImage(file) {
    const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '');
    const filePath =
      currentUser.id + '/' + Date.now() + '-' + safeName;

    const { error } = await supabaseClient.storage
      .from('post-images')
      .upload(filePath, file);

    if (error) throw error;

    const { data } = supabaseClient.storage
      .from('post-images')
      .getPublicUrl(filePath);

    return data.publicUrl;
  }

  // নতুন পোস্ট
  $('postForm').addEventListener('submit', async (event) => {
    event.preventDefault();

    const button = $('postButton');
    button.disabled = true;
    $('postMessage').textContent = 'পোস্ট সংরক্ষণ হচ্ছে...';

    try {
      const title = $('postTitle').value.trim();
      const content = $('postContent').value.trim();
      const file = $('postImage').files[0];

      let imageUrl = null;

      if (file) {
        if (!file.type.startsWith('image/')) {
          throw new Error('শুধু ছবির ফাইল নির্বাচন করুন।');
        }
        imageUrl = await uploadImage(file);
      }

      const { error } = await supabaseClient
        .from('posts')
        .insert({
          title,
          content,
          image_url: imageUrl,
          published: false
        });

      if (error) throw error;

      $('postForm').reset();
      $('postMessage').textContent =
        'পোস্ট সংরক্ষণ হয়েছে। এখনো প্রকাশ করা হয়নি।';

      await loadPosts();

    } catch (error) {
      $('postMessage').textContent =
        'সমস্যা: ' + error.message;
    } finally {
      button.disabled = false;
    }
  });

  // পোস্ট লোড
  async function loadPosts() {
    $('postsList').textContent = 'পোস্ট লোড হচ্ছে...';

    const { data, error } = await supabaseClient
      .from('posts')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      $('postsList').textContent =
        'পোস্ট লোড হয়নি: ' + error.message;
      return;
    }

    $('postsList').replaceChildren();

    if (!data || data.length === 0) {
      $('postsList').textContent = 'এখনো কোনো পোস্ট নেই।';
      return;
    }

    data.forEach((post) => {
      const item = document.createElement('div');
      item.className = 'post';

      const heading = document.createElement('h3');
      heading.textContent = post.title;
      item.appendChild(heading);

      const paragraph = document.createElement('p');
      paragraph.textContent = post.content;
      item.appendChild(paragraph);

      if (post.image_url) {
        const image = document.createElement('img');
        image.src = post.image_url;
        image.alt = post.title;
        item.appendChild(image);
      }

      const status = document.createElement('p');
      status.textContent = post.published
        ? 'অবস্থা: প্রকাশিত'
        : 'অবস্থা: প্রকাশিত হয়নি';
      item.appendChild(status);

      const publishButton = document.createElement('button');
      publishButton.textContent = post.published
        ? 'প্রকাশ বন্ধ করুন'
        : 'পোস্ট প্রকাশ করুন';

      publishButton.addEventListener('click', async () => {
        publishButton.disabled = true;

        const { error } = await supabaseClient
          .from('posts')
          .update({
            published: !post.published,
            updated_at: new Date().toISOString()
          })
          .eq('id', post.id);

        if (error) {
          alert('সমস্যা: ' + error.message);
          publishButton.disabled = false;
          return;
        }

        await loadPosts();
      });

      item.appendChild(publishButton);

      const deleteButton = document.createElement('button');
      deleteButton.textContent = 'পোস্ট মুছুন';
      deleteButton.className = 'delete';

      deleteButton.addEventListener('click', async () => {
        if (!confirm('এই পোস্টটি মুছে ফেলবেন?')) return;

        deleteButton.disabled = true;

        const { error } = await supabaseClient
          .from('posts')
          .delete()
          .eq('id', post.id);

        if (error) {
          alert('সমস্যা: ' + error.message);
          deleteButton.disabled = false;
          return;
        }

        await loadPosts();
      });

      item.appendChild(deleteButton);
      $('postsList').appendChild(item);
    });
  }

  // আগে থেকেই লগইন করা থাকলে Admin যাচাই
  async function checkExistingSession() {
    try {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session) {
        await checkAdmin();
        showAdminPanel();
        await loadPosts();
      }
    } catch (error) {
      await supabaseClient.auth.signOut();
      showLogin();
      showMessage(error.message);
    }
  }

  checkExistingSession();
</script>
</body>
</html>
