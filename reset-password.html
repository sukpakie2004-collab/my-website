<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-sizing: border-box;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      box-sizing: border-box;
      border-radius: 6px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #0d9488;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2>নতুন পাসওয়ার্ড দিন</h2>

    <form id="resetForm" hidden>
      <input id="password" type="password"
        placeholder="নতুন পাসওয়ার্ড" required minlength="8">

      <input id="confirmPassword" type="password"
        placeholder="আবার পাসওয়ার্ড লিখুন" required minlength="8">

      <button type="submit">Update Password</button>
    </form>

    <p id="message">লিংক যাচাই করা হচ্ছে...</p>
  </div>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://wxxmzqnumbgnspfdcdqb.supabase.co';

    // admin.html ফাইলের একই Publishable Key এখানে বসাবেন
    const SUPABASE_ANON_KEY = 'wxxmzqnumbgnspfdcdqb';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');

    async function checkRecoverySession() {
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          'রিসেট লিংকটি সঠিক নয় বা মেয়াদ শেষ হয়েছে। নতুন রিসেট ইমেইল নিন।';
        return;
      }

      form.hidden = false;
      message.textContent = 'নতুন পাসওয়ার্ড লিখুন।';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password =
        document.getElementById('password').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        message.textContent = 'দুটি পাসওয়ার্ড মিলছে না।';
        return;
      }

      message.textContent = 'পাসওয়ার্ড পরিবর্তন হচ্ছে...';

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = 'সমস্যা: ' + error.message;
        return;
      }

      await supabase.auth.signOut();

      message.textContent =
        'পাসওয়ার্ড পরিবর্তন হয়েছে। এখন Admin Login করুন।';

      setTimeout(() => {
        window.location.href = './admin.html';
      }, 2000);
    });

    checkRecoverySession();
  </script>
</body>
</html>
